<div>
  <div class="page-header">
    <div class="header-left"><h1>Settings</h1><p>Personalize your experience</p></div>
  </div>
  <div class="settings-grid">
    <div class="setting-row">
      <div><div class="setting-label">🌙 Dark Mode</div><div class="setting-desc">Toggle between dark and light theme</div></div>
      <div class="toggle-switch" id="darkModeToggle"></div>
    </div>
    <div class="setting-row">
      <div><div class="setting-label">🔔 Browser Notifications</div><div class="setting-desc">Morning and evening task reminders</div></div>
      <div class="toggle-switch" id="notifToggle"></div>
    </div>
    <div class="setting-row">
      <div><div class="setting-label">🔊 Sound Effects</div><div class="setting-desc">Play sounds on task completion</div></div>
      <div class="toggle-switch" id="soundToggle"></div>
    </div>
    <div class="setting-row">
      <div><div class="setting-label">🎉 Confetti Animation</div><div class="setting-desc">Celebrate completing all daily tasks</div></div>
      <div class="toggle-switch on" id="confettiToggle"></div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="card-title" style="margin-bottom:12px;"><span class="title-icon">💾</span> Data Management</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;">
    <button class="btn btn-secondary" id="exportBtn">📤 Export JSON</button>
    <button class="btn btn-secondary" id="importBtn">📥 Import JSON</button>
    <button class="btn btn-danger" id="resetBtn">🗑️ Reset All Data</button>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none">
</div>
