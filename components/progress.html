<div>
  <div class="page-header">
    <div class="header-left"><h1>Progress Graph</h1><p>Your consistency over time</p></div>
  </div>
  <div class="card" style="margin-bottom:20px;">
    <div class="card-header">
      <div class="card-title"><span class="title-icon">📈</span> Consistency Score</div>
      <div class="tabs">
        <button class="tab-btn active" data-chart-range="week">Week</button>
        <button class="tab-btn" data-chart-range="month">Month</button>
        <button class="tab-btn" data-chart-range="all">All Time</button>
      </div>
    </div>
    <canvas id="progressChart" height="100"></canvas>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="card-title" style="margin-bottom:14px;"><span class="title-icon">📉</span> Streak Growth</div>
      <canvas id="streakChart" height="120"></canvas>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:14px;"><span class="title-icon">🎯</span> Completion Rate</div>
      <canvas id="completionChart" height="120"></canvas>
    </div>
  </div>
</div>
