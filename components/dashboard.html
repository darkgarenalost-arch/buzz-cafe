<div>
  <div class="page-header">
    <div class="header-left">
      <h1 id="greeting">Good Morning </h1>
      <p id="currentDate">—</p>
    </div>
    <div class="header-right">
      <button class="btn btn-primary" id="addTaskBtn">+ Add Task</button>
      <button class="btn btn-secondary" id="notifBtn">🔔 Remind Me</button>
    </div>
  </div>

  <div class="grid-4" style="margin-bottom:20px;">
    <div class="stat-card purple">
      <div class="stat-icon">🔥</div>
      <div class="stat-label">Current Streak</div>
      <div class="stat-value glow-text" id="currentStreak">0</div>
      <div class="stat-sub">days in a row</div>
    </div>
    <div class="stat-card green">
      <div class="stat-icon">⚡</div>
      <div class="stat-label">XP Points</div>
      <div class="stat-value" id="dashXP" style="background:var(--gradient-2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">0</div>
      <div class="stat-sub" id="dashLevel">Level 1</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-icon">✅</div>
      <div class="stat-label">Done Today</div>
      <div class="stat-value" id="todayDone" style="background:var(--gradient-3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">0/0</div>
      <div class="stat-sub" id="todayPct">0% complete</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-icon">🏆</div>
      <div class="stat-label">Longest Streak</div>
      <div class="stat-value" id="longestStreak" style="background:linear-gradient(135deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">0</div>
      <div class="stat-sub">days record</div>
    </div>
  </div>

  <div class="grid-2" style="margin-bottom:20px;">
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="title-icon">🎯</span> Today's Progress</div>
      </div>
      <div class="ring-wrap">
        <svg class="ring-svg" width="100" height="100" viewBox="0 0 100 100">
          <circle class="ring-bg" cx="50" cy="50" r="42"/>
          <circle class="ring-fg" id="todayRing" cx="50" cy="50" r="42" stroke="url(#ringGrad)" stroke-dasharray="264" stroke-dashoffset="264"/>
          <text class="ring-text" x="50" y="54" text-anchor="middle" fill="var(--text-primary)" font-family="Inter,sans-serif" font-weight="800" id="ringPctText">0%</text>
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#7c5cfc"/>
              <stop offset="100%" stop-color="#fc5c7d"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="ring-info">
          <div class="ring-stat"><div class="ring-dot" style="background:var(--accent)"></div> <span id="ringCompleted">0 completed</span></div>
          <div class="ring-stat"><div class="ring-dot" style="background:var(--border)"></div> <span id="ringRemaining">0 remaining</span></div>
          <div class="ring-stat"><div class="ring-dot" style="background:var(--accent-4)"></div> <span id="ringXpToday">+0 XP today</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="title-icon">💚</span> Productivity Health</div>
      </div>
      <div class="meter-wrap">
        <canvas class="meter-canvas" id="meterCanvas" width="200" height="110"></canvas>
        <div class="meter-label">
          <div class="meter-score" id="meterScore">—</div>
          <div class="meter-status" id="meterStatus">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:20px;">
    <div class="card-header">
      <div class="card-title"><span class="title-icon">⚡</span> Experience & Level</div>
      <div class="level-badge" id="levelBadge">⭐ Level 1</div>
    </div>
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
      <div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;">Total XP</div>
        <div class="xp-value" id="xpValue">0</div>
      </div>
      <div style="flex:1;min-width:200px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:11px;color:var(--text-muted);">
          <span id="xpCurrent">0 XP</span>
          <span id="xpNext">100 XP to next level</span>
        </div>
        <div class="xp-bar-wrap">
          <div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title"><span class="title-icon">📋</span> Today's Tasks</div>
      <button class="btn btn-secondary" style="font-size:12px;padding:6px 12px;" data-route="tasks">See All →</button>
    </div>
    <div class="task-list" id="dashboardTaskList"></div>
  </div>
</div>
