<div>
  <div class="page-header">
    <div class="header-left"><h1>Habit Heatmap</h1><p>365 days of activity</p></div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title"><span class="title-icon">🗓️</span> Activity</div>
      <div class="heatmap-legend">
        Less <div class="heatmap-legend-cell" style="background:var(--border)"></div>
        <div class="heatmap-legend-cell" data-level="1"></div>
        <div class="heatmap-legend-cell" data-level="2"></div>
        <div class="heatmap-legend-cell" data-level="3"></div>
        <div class="heatmap-legend-cell" data-level="4"></div>
        More
      </div>
    </div>
    <div class="heatmap-wrap">
      <div style="display:flex;">
        <div class="heatmap-days">
          <span>Mon</span><span>Wed</span><span>Fri</span>
        </div>
        <div>
          <div class="heatmap-months" id="heatmapMonths"></div>
          <div class="heatmap-grid" id="heatmapGrid"></div>
        </div>
      </div>
    </div>
  </div>
</div>
