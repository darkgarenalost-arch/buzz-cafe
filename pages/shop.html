<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Clad Whale</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="shop-page" data-page="shop">
  <div data-header></div>
  <main class="page-shell shop-layout">
    <section class="page-hero">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:20px">
        <div>
          <h1 class="page-title">Shop</h1>
          <div class="crumbs"><a href="../index.html">Home</a><span>›</span><b>Shop</b></div>
        </div>
        <button class="btn" data-filter>Filter</button>
      </div>
    </section>
    <div class="pill-row" data-category-pills></div>
    <div class="shop-toolbar">
      <div class="sort-control">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>Sort by: <strong style="color:white">Newest</strong>⌄</span>
      </div>
      <div data-product-count>0 Products</div>
    </div>
    <div class="product-grid" data-shop-products></div>
  </main>
  <div data-bottom-nav></div>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
