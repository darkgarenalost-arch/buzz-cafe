<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Clad Whale</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="cart-page" data-page="cart">
  <div data-header></div>
  <main class="page-shell" style="padding-bottom:92px">
    <section class="page-hero">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:18px">
        <div>
          <h1 class="page-title">Your Cart</h1>
          <div class="crumbs" data-cart-count-label>0 Items in your cart</div>
        </div>
        <button class="btn" data-clear-cart>Clear Cart</button>
      </div>
    </section>

    <section class="cart-list" data-cart-list></section>

    <section class="shipping-card">
      <svg viewBox="0 0 24 24" style="width:58px;color:var(--cyan)"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <div>
        <div style="color:var(--muted);font-size:19px">Add ₹310 more to avail</div>
        <strong style="display:block;font-size:27px;text-transform:uppercase">Free Shipping</strong>
        <div class="progress"><span></span></div>
      </div>
      <div class="price" style="font-size:20px;text-align:right">₹310 to go</div>
    </section>

    <section class="summary-card">
      <h2 class="section-title" style="font-size:31px">Order Summary</h2>
      <div data-summary></div>
    </section>

    <div style="display:grid;gap:18px;margin-top:22px">
      <a class="btn btn-primary" href="./checkout.html">Proceed To Checkout</a>
      <a class="link-cyan" href="./shop.html" style="text-align:center">‹ Continue Shopping</a>
    </div>
  </main>
  <div data-bottom-nav></div>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
